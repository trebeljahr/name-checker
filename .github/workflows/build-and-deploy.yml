name: build-and-deploy

on:
  push:
    branches: [main]

concurrency:
  group: main-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Public origin: the Worker serves the pages, `/api/*` goes to the server.
  SITE_URL: https://names.trebeljahr.com
  # Pinned; also used by the deploy job. Bump deliberately.
  WRANGLER: wrangler@4.145.0

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # After the build: the packages type against @starter/shared's dist/.
      - run: pnpm run typecheck
      - run: pnpm run test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Against the static export served like the Worker serves it, with the
      # API server behind /api (playwright.config.ts).
      - run: pnpm run test:e2e
        env:
          CI: "true"
          E2E_PORT: "51847"

  # The API server image (packages/server). Coolify pulls `:main`.
  build-server:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: true
          build-args: |
            BUILD_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}-server:main
            ghcr.io/${{ github.repository }}-server:${{ github.sha }}

  # The web client: a static export uploaded as a new version of the
  # assets-only Worker `name-checker-client` (wrangler.jsonc). Uploading
  # does not make it live; the deploy job activates it once the server for
  # this commit answers. One step would leave seconds of 404s on new chunks.
  build-client:
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    outputs:
      version: ${{ steps.upload.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      # NEXT_PUBLIC_* are inlined at build time. The analytics and error
      # reporting values are GitHub Actions repo VARIABLES (not secrets: the
      # browser posts to the DSN, so it is in the bundle either way):
      #   gh variable set NEXT_PUBLIC_PLAUSIBLE_DOMAIN --body names.trebeljahr.com
      #   gh variable set NEXT_PUBLIC_SENTRY_DSN --body 'https://<key>@glitchtip.trebeljahr.com/<id>'
      - run: pnpm run build:client
        env:
          NEXT_PUBLIC_BUILD_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
          NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
      # An empty NEXT_PUBLIC_SENTRY_DSN builds a client that reports nothing
      # and ships none of the SDK. Say which one this is.
      - name: Say whether this build reports errors
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          if [ -z "${NEXT_PUBLIC_SENTRY_DSN:-}" ]; then
            echo "::notice::NEXT_PUBLIC_SENTRY_DSN is not set — this build reports no errors. See docs/deploy.md → Error reporting."
          else
            echo "Error reporting is on: NEXT_PUBLIC_SENTRY_DSN is set."
          fi
      # A Worker version serves only its own files: carry the chunks of the
      # last two releases so tabs opened on them keep working. The script is
      # hatchkit's (cli/src/templates/client-host/scripts/carry-static.mjs).
      # The first Worker version was uploaded by hand with a manifest, so a
      # missing live manifest is an error here, not a fresh start.
      - run: node scripts/carry-static.mjs --site "$SITE_URL" --out packages/client/out --require-previous
      - run: node packages/client/scripts/check-export.mjs
      - name: Upload the client version (not live yet)
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          npx --yes "$WRANGLER" versions upload \
            --tag "${GITHUB_SHA:0:12}" --message "$GITHUB_SHA"
          version=$(jq -r 'select(.type == "version-upload") | .version_id' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "::error::wrangler reported no version id"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "uploaded client version $version"

  # Server first, then the client: the client switch is one step that takes
  # seconds, so it waits for the verified server. The gap that remains is an
  # old tab calling the new server, the same as any API release.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-server, build-client]
    steps:
      # Coolify pulls without credentials. GHCR creates a new package as
      # private, so the first push of `name-checker-server` cannot be pulled
      # until the package is made public (package settings on GitHub). Fail
      # here, before Coolify is called; re-run this job afterwards.
      - name: Check the server image can be pulled anonymously
        run: |
          image="${GITHUB_REPOSITORY}-server"
          if ! token=$(curl -fsS "https://ghcr.io/token?scope=repository:${image}:pull" | jq -r '.token // empty') \
            || [ -z "$token" ]; then
            echo "::error::No anonymous pull token for ${image}: the package is private (make it public, then re-run this job) or GHCR is unreachable."
            exit 1
          fi
          if ! curl -fsS -o /dev/null -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/${image}/manifests/${GITHUB_SHA}"; then
            echo "::error::ghcr.io/${image}:${GITHUB_SHA} cannot be pulled anonymously. Make the package public, then re-run this job."
            exit 1
          fi

      # The server image answers /api/* only. While the Next container still
      # serves the pages (before the Worker route exists), deploying it would
      # leave names.trebeljahr.com without pages. See docs/deploy.md.
      - name: Refuse while the Next container serves the pages
        run: |
          # Fail closed: no answer from / is not proof that the Worker serves it.
          headers=$(curl -fsSI "$SITE_URL/")
          if printf '%s' "$headers" | grep -qi '^x-powered-by: *next\.js'; then
            echo "::error::$SITE_URL/ is still served by the Next container. Create the Worker route first (docs/deploy.md)."
            exit 1
          fi

      # Tell Coolify to deploy. There is no Coolify API token here: each
      # app has its own webhook secret (hatchkit mints it), and a `push`
      # payload signed with it queues a deploy of that one app — it can
      # read nothing and touch no other app. The payload names
      # `.hatchkit/deploy-webhook`, the app's only watch path, so an ordinary
      # push that reaches Coolify through its GitHub App never deploys a
      # build that does not exist yet; only this step does.
      #
      # Which apps: COOLIFY_RESOURCE_UUID for a single-app project, or
      # COOLIFY_SERVER_/COOLIFY_CLIENT_RESOURCE_UUID for a split one.
      # hatchkit sets one set and clears the other.
      - name: Deploy via signed Coolify webhook
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_RESOURCE_UUID: ${{ secrets.COOLIFY_RESOURCE_UUID }}
          COOLIFY_DEPLOY_SECRET: ${{ secrets.COOLIFY_DEPLOY_SECRET }}
          COOLIFY_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_DEPLOY_REPOSITORY }}
          COOLIFY_DEPLOY_BRANCH: ${{ secrets.COOLIFY_DEPLOY_BRANCH }}
          COOLIFY_SERVER_RESOURCE_UUID: ${{ secrets.COOLIFY_SERVER_RESOURCE_UUID }}
          COOLIFY_SERVER_DEPLOY_SECRET: ${{ secrets.COOLIFY_SERVER_DEPLOY_SECRET }}
          COOLIFY_SERVER_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_SERVER_DEPLOY_REPOSITORY }}
          COOLIFY_SERVER_DEPLOY_BRANCH: ${{ secrets.COOLIFY_SERVER_DEPLOY_BRANCH }}
          COOLIFY_CLIENT_RESOURCE_UUID: ${{ secrets.COOLIFY_CLIENT_RESOURCE_UUID }}
          COOLIFY_CLIENT_DEPLOY_SECRET: ${{ secrets.COOLIFY_CLIENT_DEPLOY_SECRET }}
          COOLIFY_CLIENT_DEPLOY_REPOSITORY: ${{ secrets.COOLIFY_CLIENT_DEPLOY_REPOSITORY }}
          COOLIFY_CLIENT_DEPLOY_BRANCH: ${{ secrets.COOLIFY_CLIENT_DEPLOY_BRANCH }}
        # Every push deploys the app COOLIFY_RESOURCE_UUID names: the API
        # server, on the Compose app until `hatchkit migrate-runtime` moves
        # it to a Docker Image app (hatchkit repoints the secrets).
        if: env.COOLIFY_BASE_URL != ''
        run: |
          set -euo pipefail
          deployed=0
          deploy() { # label, secret-name prefix
            local uuid_var="${2}RESOURCE_UUID" secret_var="${2}DEPLOY_SECRET"
            local repo_var="${2}DEPLOY_REPOSITORY" branch_var="${2}DEPLOY_BRANCH"
            local uuid="${!uuid_var:-}" secret="${!secret_var:-}"
            local repo="${!repo_var:-}" branch="${!branch_var:-}"
            [ -n "$uuid" ] || return 0
            if [ -z "$secret" ] || [ -z "$repo" ] || [ -z "$branch" ]; then
              echo "::error::${2}DEPLOY_SECRET/_REPOSITORY/_BRANCH are not set — run \`hatchkit sync\` or \`hatchkit secrets isolate\`."
              exit 1
            fi
            local body sig answer
            body=$(jq -cn --arg ref "refs/heads/$branch" --arg sha "$GITHUB_SHA" --arg repo "$repo" \
              '{ref: $ref, after: $sha, repository: {full_name: $repo}, commits: [{id: $sha, added: [], removed: [], modified: [".hatchkit/deploy-webhook"]}]}')
            sig=$(printf '%s' "$body" | HOOK_SECRET="$secret" node -e \
              'process.stdout.write(require("node:crypto").createHmac("sha256", process.env.HOOK_SECRET).update(require("node:fs").readFileSync(0)).digest("hex"))')
            answer=$(curl -fsS -X POST "$COOLIFY_BASE_URL/webhooks/source/github/events/manual" \
              -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
              -H "X-Hub-Signature-256: sha256=$sig" --data-binary "$body")
            if printf '%s' "$answer" | jq -e --arg uuid "$uuid" \
              'type == "array" and any(.[]; .application_uuid == $uuid and .status == "success")' \
              >/dev/null 2>&1; then
              echo "deploy queued for the $1 app ($uuid)"
              deployed=$((deployed + 1))
            else
              # Other apps on the same repo answer "Invalid signature.";
              # they are left out so a public log names only this one.
              detail=$(printf '%s' "$answer" | jq -c '[.[]? | select(.message != "Invalid signature.") | {status, message}]' 2>/dev/null || printf '%s' "$answer" | head -c 200)
              echo "::error::Coolify did not queue a deploy of the $1 app: $detail"
              exit 1
            fi
          }
          deploy app COOLIFY_
          deploy server COOLIFY_SERVER_
          deploy client COOLIFY_CLIENT_
          if [ "$deployed" -eq 0 ]; then
            echo "::error::COOLIFY_BASE_URL is set but no COOLIFY_*RESOURCE_UUID is — nothing was deployed."
            exit 1
          fi

      - name: Wait for the API server to run this commit
        run: |
          for _ in $(seq 1 60); do
            version=$(curl -fsS "$SITE_URL/api/health" | jq -r '.version // empty' || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              echo "API server runs $GITHUB_SHA"
              exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE_URL/api/health did not report $GITHUB_SHA within 10 minutes; the client was not switched."
          exit 1

      - name: Activate the client version
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ needs.build-client.outputs.version }}
        run: |
          npx --yes "$WRANGLER" versions deploy "$VERSION@100%" \
            --name name-checker-client --message "$GITHUB_SHA" --yes

      - name: Check the client release
        run: |
          for _ in $(seq 1 24); do
            commit=$(curl -fsS "$SITE_URL/version.json" | jq -r '.commit // empty' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "client serves $GITHUB_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::$SITE_URL/version.json did not report $GITHUB_SHA within 2 minutes. The server for this commit is live; the client is not."
          exit 1
