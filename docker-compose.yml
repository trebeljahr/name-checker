# Production Docker Compose — deploy as a Coolify Service Stack.
# Coolify auto-detects ${VAR_NAME} syntax and creates UI fields for each.
# Do NOT expose ports here — Coolify's Traefik handles external routing.

services:
  client:
    image: ${CLIENT_IMAGE:-ghcr.io/trebeljahr/name-checker-client:main}
    pull_policy: always
    volumes:
      - auth-data:/app/data
    environment:
      PORT: "6657"
      HOSTNAME: "0.0.0.0"
      AUTH_DB_PATH: /app/data/auth.db
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be configured in Coolify}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be configured in Coolify}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-ses}
      SES_PROJECT_ACCESS_KEY_ID: ${SES_PROJECT_ACCESS_KEY_ID:?Configure the project SES sender}
      SES_PROJECT_SECRET_ACCESS_KEY: ${SES_PROJECT_SECRET_ACCESS_KEY:?Configure the project SES sender}
      SES_PROJECT_REGION: ${SES_PROJECT_REGION:?Configure the project SES sender}
      SES_PROJECT_IDENTITY_ARN: ${SES_PROJECT_IDENTITY_ARN:?Configure the project SES sender}
      SES_PROJECT_TENANT: ${SES_PROJECT_TENANT:?Configure the project SES sender}
      SES_PROJECT_CONFIGURATION_SET: ${SES_PROJECT_CONFIGURATION_SET:?Configure the project SES sender}
      SES_PROJECT_FROM_EMAIL: ${SES_PROJECT_FROM_EMAIL:?Configure the project SES sender}
      SES_PROJECT_REPLY_TO: ${SES_PROJECT_REPLY_TO:-rico@trebeljahr.com}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-rico@trebeljahr.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-name-check <noreply@example.com>}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-}
      CRON_SECRET: ${CRON_SECRET:-}
      PASSPORT_ACTIONS_ENABLED: ${PASSPORT_ACTIONS_ENABLED:-0}
      NEXT_PUBLIC_API_URL: ${API_URL}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-}
      NEXT_PUBLIC_OPENPANEL_CLIENT_ID: ${OPENPANEL_CLIENT_ID:-}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${PLAUSIBLE_DOMAIN:-}
      NEXT_PUBLIC_PLAUSIBLE_SCRIPT_URL: ${PLAUSIBLE_SCRIPT_URL:-}
      NEXT_PUBLIC_SENTRY_DSN: ${CLIENT_SENTRY_DSN:-}
    restart: unless-stopped


volumes:
  auth-data:
